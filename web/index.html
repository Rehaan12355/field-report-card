<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Click a farm field to see its crop history, bare-soil weeks and heavy-rain risk, read from NASA satellite data."
    />
    <title>Field Report Card</title>
  </head>
  <body>
    <header id="topbar">
      <a class="brand" href="./">
        <svg viewBox="0 0 26 18" aria-hidden="true">
          <rect class="wk-green" x="0" y="0" width="5" height="18" rx="1.5" />
          <rect class="wk-bare" x="7" y="0" width="5" height="18" rx="1.5" />
          <rect class="wk-exposed" x="14" y="0" width="5" height="18" rx="1.5" />
          <rect class="wk-green" x="21" y="0" width="5" height="18" rx="1.5" />
        </svg>
        <span>Field Report Card</span>
      </a>
      <p id="region"></p>
      <nav>
        <label class="switch"><input type="checkbox" id="aerial" /><span></span>Aerial photo</label>
        <a class="button button-quiet" href="./methods.html">How it works</a>
      </nav>
    </header>
    <div id="map"></div>
    <div id="legend" hidden></div>
    <aside id="card" aria-live="polite">
      <div class="skeleton" aria-label="Loading the fields">
        <div class="sk sk-title"></div>
        <div class="sk sk-line"></div>
        <div class="sk sk-line short"></div>
        <div class="sk sk-block"></div>
      </div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
